<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Созвон — апелляция</title>
  <link rel="stylesheet" href="/admin/app.css">
</head>
<body>
  <div class="login-shell">
    <form id="appeal-form" class="card login-card">
      <div class="brand"><span class="brand-dot"></span> Созвон</div>
      <h1>Апелляция</h1>
      <p class="muted">Если аккаунт заблокирован, опишите ситуацию. Не указывайте пароль, коды и данные карт.</p>
      <label>Логин<input id="appeal-username" autocomplete="username"></label>
      <label>Контакт для ответа<input id="appeal-contact" autocomplete="email" placeholder="Email или телефон"></label>
      <label>Что произошло<textarea id="appeal-reason" rows="6" required maxlength="4000"></textarea></label>
      <button class="primary" type="submit">Отправить</button>
      <p id="appeal-status" class="muted" role="status"></p>
    </form>
  </div>
  <script src="/appeal/app.js" defer></script>
</body>
</html>
