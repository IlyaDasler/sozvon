<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Созвон — администрирование в настройках (preview)</title>
  <style>
    :root { color-scheme: dark; --bg-deep:#080c12; --bg-2:#0b111a; --bg-3:#16202d; --bg-4:#111b26; --bg-5:#1d2b3a; --line:#17212e; --line-strong:#223041; --text:#e9f1f5; --text-2:#aebdc8; --muted:#7c8e9c; --accent:#2ecbbe; --accent-2:#77e7dc; --danger:#f2555a; --ok:#4ade80; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(90vw 80vh at 70% 10%,#273b35,#0b1119 58%,#070a10); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; display:grid; place-items:center; }
    .modal { width:100vw; height:100vh; display:grid; place-items:center; background:rgba(4,8,13,.45); backdrop-filter:blur(5px); }
    .set-card { width:min(980px,94vw); height:min(680px,90vh); display:flex; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--bg-2); box-shadow:0 30px 100px rgba(0,0,0,.55); }
    .set-nav { width:228px; border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:3px; flex:none; }
    .set-title { font-weight:700; padding:4px 10px 16px; font-size:14px; }
    .set-nav button { border:1px solid transparent; background:transparent; color:var(--muted); text-align:left; border-radius:9px; padding:9px 11px; font:inherit; font-size:13px; }
    .set-nav button.active { color:var(--text); background:rgba(255,255,255,.08); border-color:var(--line); }
    .set-nav .admin { color:var(--accent-2); }
    .set-main { flex:1; min-width:0; padding:18px 24px; overflow:auto; }
    .set-head { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:13px; margin-bottom:18px; }
    .set-head h2 { margin:0; font-size:20px; letter-spacing:-.02em; }
    .set-head .x { width:30px; height:30px; border:1px solid var(--line); border-radius:9px; background:rgba(255,255,255,.04); color:var(--text); }
    .muted { color:var(--muted); } .small { font-size:12px; }
    .card-head { padding:14px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025); margin-bottom:12px; }
    .card-head h3 { margin:0 0 5px; font-size:15px; } .card-head p { margin:0; color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .admin-card { text-align:left; display:grid; gap:5px; padding:14px; border-radius:12px; border:1px solid var(--line); background:color-mix(in srgb,var(--bg-3) 55%,transparent); color:var(--text); font:inherit; }
    .admin-card b { font-size:13px; } .admin-card span { color:var(--muted); font-size:12px; line-height:1.4; }
    .admin-card.super { border-color:color-mix(in srgb,var(--accent) 35%,var(--line)); }
    .badge { display:inline-flex; border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line)); color:var(--accent-2); border-radius:999px; padding:2px 7px; font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
    .preview-note { position:fixed; bottom:8px; left:0; right:0; text-align:center; color:rgba(255,255,255,.35); font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
  </style>
</head>
<body>
  <div class="modal">
    <div class="set-card">
      <nav class="set-nav">
        <div class="set-title">Настройки</div>
        <button>Профиль</button><button>Оформление</button><button>Звук и видео</button><button>Уведомления</button><button>Аккаунт</button><button>Данные и приватность</button><button>О приложении</button>
        <button class="active admin">Администрирование</button>
        <div style="margin-top:auto"><button style="color:var(--danger)">Выйти из аккаунта</button></div>
      </nav>
      <section class="set-main">
        <header class="set-head"><h2>Администрирование</h2><button class="x">×</button></header>
        <div class="card-head"><h3>Администрирование</h3><p>Модерация пользователей и каналов. Переписка и ключи недоступны.</p></div>
        <div class="grid">
          <button class="admin-card"><b>Пользователи</b><span>Логины, почта, последний вход, статусы и баны.</span></button>
          <button class="admin-card"><b>Каналы</b><span>Все каналы, приватность, удаление.</span></button>
          <button class="admin-card"><b>Жалобы</b><span>Очередь обращений пользователей.</span></button>
          <button class="admin-card"><b>Апелляции</b><span>Обращения забаненных.</span></button>
          <button class="admin-card super"><b>Подтверждения <span class="badge">super</span></b><span>Необратимые действия модераторов.</span></button>
          <button class="admin-card super"><b>Роли <span class="badge">super</span></b><span>Выдать или отозвать модератора.</span></button>
          <button class="admin-card"><b>Аудит</b><span>История действий администрации.</span></button>
        </div>
      </section>
    </div>
  </div>
  <div class="preview-note">preview — not released</div>
</body>
</html>
