name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  windows-installer:
    runs-on: windows-latest
    needs: server-tests
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Свой захват экрана (native/capture) — компилируется MSVC раннера
      - run: npm run native
      - run: npm run dist
      # Подпись релиза (docs/code-signing.md): включается, когда в настройках репозитория задана переменная
      # SIGNPATH_ORGANIZATION_ID и секрет SIGNPATH_API_TOKEN. Шаг ждёт ручного подтверждения на signpath.io
      - id: unsigned
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: client/dist/Sozvon-Setup-*.exe
          if-no-files-found: error
      - if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: sozvon
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: client/dist-signed
      - if: steps.unsigned.outcome == 'success'
        run: node scripts/use-signed-installer.js dist dist-signed
      - uses: actions/upload-artifact@v4
        with:
          name: Sozvon-Setup
          path: client/dist/*.exe
      # При пуше тега vX.Y.Z установщик прикрепляется к релизу.
      # latest.yml и .blockmap нужны автообновлению: по ним приложение узнаёт о новой версии
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false # у подписанного релиза нет .blockmap
          files: |
            client/dist/*.exe
            client/dist/*.exe.blockmap
            client/dist/latest.yml
