name: Сборка

env:
  # GitHub release-assets периодически отдаёт 504; зеркало Electron стабильнее
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Go — единственный сервер. Тесты включают сторожа контракта:
  # маршруты и имена событий WebSocket сверяются с фикстурами server-go/contract/*.json
  go-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /tmp/sozvon-server-go .
      # Утилита резервных копий собирается отдельно: её запускает таймер на сервере
      - run: go build -o /tmp/sozvon-backup ./cmd/backup
      # Готовые бинарники для VPS: setup.sh скачивает их из релиза
      - name: Бинарники для Linux
        run: |
          mkdir -p dist-go
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o dist-go/sozvon-go-linux-$arch .
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o dist-go/sozvon-backup-linux-$arch ./cmd/backup
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o dist-go/sozvon-mailtest-linux-$arch ./cmd/mailtest
          done
          (cd dist-go && sha256sum sozvon-go-linux-* sozvon-backup-linux-* sozvon-mailtest-linux-* > SHA256SUMS-go.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: sozvon-go-linux
          path: server-go/dist-go/*
          if-no-files-found: error

  # Бинарники Go прикрепляются к релизу: их скачивает deploy/vps/setup.sh
  go-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: go-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sozvon-go-linux
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Сквозные сценарии на каждом PR: интерфейс, группы, голос, чат, треды.
  # Отдельный Windows-раннер, потому что e2e запускает настоящий Electron.
  e2e:
    runs-on: windows-latest
    needs: go-tests
    env:
      E2E_NO_GPU: '1'
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Клиентские unit-тесты
        run: npm test
      # npm 11 в этом образе не всегда запускает postinstall Electron — качаем бинарь явно.
      - name: Бинарь Electron для e2e
        run: node node_modules/electron/install.js
      - run: npm run native
      - name: Собрать Go-сервер
        working-directory: server-go
        run: go build -o "${{ runner.temp }}\sozvon-e2e.exe" .
      - name: E2E
        shell: pwsh
        run: |
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP 'sozvon-e2e-data'
          $env:PORT = '3000'
          $env:AUTH_RATE_LIMIT = '500'
          $env:MESSAGE_RATE_LIMIT = '200'
          $env:MAIL_TEST_FILE = Join-Path $env:RUNNER_TEMP 'mail.log'
          $env:LINK_PREVIEW_ALLOW_PRIVATE = '1'
          $env:LIVEKIT_MIN_MEMBERS = '5'
          $server = Start-Process -FilePath (Join-Path $env:RUNNER_TEMP 'sozvon-e2e.exe') `
            -WorkingDirectory (Join-Path $env:GITHUB_WORKSPACE 'server-go') `
            -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'server.log') `
            -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'server.err') `
            -PassThru
          $code = 1
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/api/health -TimeoutSec 2
                if ($r.StatusCode -eq 200) { break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            node scripts/run-e2e.js e2e-layout e2e-look e2e-spacing e2e-hubs e2e-contrast e2e-fuji e2e-themes e2e-mobile e2e-mobile-frames e2e-mobile-friends e2e-mobile-utility e2e-mobile-wallpapers e2e-mobile-formfactors e2e-call-multi-device e2e-screen-web-stop e2e-room-groups e2e-threads e2e-groups e2e-chat e2e-friends e2e-unread e2e-call-in-room
            $code = $LASTEXITCODE
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            if ($code -ne 0) {
              Get-Content (Join-Path $env:RUNNER_TEMP 'server.log') -ErrorAction SilentlyContinue | Select-Object -Last 40
              Get-Content (Join-Path $env:RUNNER_TEMP 'server.err') -ErrorAction SilentlyContinue | Select-Object -Last 40
            }
          }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: client/e2e-logs/*

  # macOS собирается только на macOS-раннере: electron-builder не умеет делать .dmg с Windows.
  # Сборка без сертификата Apple: приложение не подписано, автообновление на macOS отключено в main.js
  mac-builder:
    runs-on: macos-latest
    needs: go-tests
    # Пустой секрет нельзя передавать как CSC_LINK: electron-builder примет его за путь к файлу.
    # Поэтому значение поднимаем в переменную и выбираем шаг сборки по ней
    env:
      MAC_CERT: ${{ secrets.MAC_CERT_P12 }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # НЕРУШИМО: автообновление macOS проверяется до сборки. Красный тест = нет релиза.
      - name: Тест автообновления macOS
        run: node --test test/mac-update.test.js
      # Своего нативного захвата экрана для macOS нет: трансляция идёт через Chromium
      - name: Сборка без подписи
        if: env.MAC_CERT == ''
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Включается само, когда в репозитории появятся секреты (docs/macos-signing.md)
      - name: Сборка с подписью Apple
        if: env.MAC_CERT != ''
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Реальный e2e: локальный фид → prepare → sha512 → ditto → swap .app.
      # Падает — релиз и артефакты не уходят.
      - name: E2E автообновления macOS
        run: node scripts/e2e-mac-update.js
      # Контрольные суммы: если загрузка оборвалась, macOS скажет «образ повреждён» —
      # по этой сумме человек проверит файл до установки
      - name: Контрольные суммы
        working-directory: client/dist
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS-mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sozvon-mac
          path: |
            client/dist/*.dmg
            client/dist/*.zip
            client/dist/SHA256SUMS-mac.txt
            client/dist/latest-mac.yml
          if-no-files-found: error
      # latest-mac.yml нужен автообновлению (если когда-нибудь появится подпись Apple)
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            client/dist/*.dmg
            client/dist/*.zip
            client/dist/latest-mac.yml
            client/dist/SHA256SUMS-mac.txt

  windows-installer:
    runs-on: windows-latest
    needs: go-tests
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Свой захват экрана (native/capture) — компилируется MSVC раннера
      - run: npm run native
      - run: npm run dist
      # Подпись релиза (docs/code-signing.md): включается, когда в настройках репозитория задана переменная
      # SIGNPATH_ORGANIZATION_ID и секрет SIGNPATH_API_TOKEN. Шаг ждёт ручного подтверждения на signpath.io
      - id: unsigned
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: client/dist/Sozvon-Setup-*.exe
          if-no-files-found: error
      - if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: sozvon
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: client/dist-signed
      - if: steps.unsigned.outcome == 'success'
        run: node scripts/use-signed-installer.js dist dist-signed
      # Контрольная сумма установщика: по ней видно, что файл докачался целиком
      - name: Контрольные суммы
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: client/dist
        run: |
          Get-FileHash -Algorithm SHA256 *.exe | ForEach-Object {
            "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf)
          } | Set-Content -Encoding utf8 SHA256SUMS-win.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sozvon-Setup
          path: |
            client/dist/*.exe
            client/dist/SHA256SUMS-win.txt
      # При пуше тега vX.Y.Z установщик прикрепляется к релизу.
      # latest.yml и .blockmap нужны автообновлению: по ним приложение узнаёт о новой версии
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false # у подписанного релиза нет .blockmap
          files: |
            client/dist/*.exe
            client/dist/*.exe.blockmap
            client/dist/latest.yml
            client/dist/SHA256SUMS-win.txt

  # Веб-версия обновляется сразу после тега, а не только по таймеру на сервере.
  web:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Выложить renderer на сервер
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/sozvon_deploy
          chmod 600 ~/.ssh/sozvon_deploy
          ssh-keyscan -H 135.106.226.12 >> ~/.ssh/known_hosts
          rsync -az --delete --exclude 'updates/'             -e "ssh -i ~/.ssh/sozvon_deploy -o StrictHostKeyChecking=yes"             client/renderer/ root@135.106.226.12:/opt/sozvon-web/
          ssh -i ~/.ssh/sozvon_deploy -o StrictHostKeyChecking=yes root@135.106.226.12             "printf '%s\n' '${GITHUB_REF_NAME}' > /opt/sozvon-web/.release"
