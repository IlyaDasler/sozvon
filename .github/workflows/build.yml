name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  windows-installer:
    runs-on: windows-latest
    needs: server-tests
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Sozvon-Setup
          path: client/dist/*.exe
      # При пуше тега vX.Y.Z установщик прикрепляется к релизу.
      # latest.yml и .blockmap нужны автообновлению: по ним приложение узнаёт о новой версии
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/dist/*.exe
            client/dist/*.exe.blockmap
            client/dist/latest.yml
